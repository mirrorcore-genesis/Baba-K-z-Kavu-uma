version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: babakiz_postgres
    restart: always
    environment:
      POSTGRES_USER: babakiz_user
      POSTGRES_PASSWORD: babakiz_secret_password
      POSTGRES_DB: babakiz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: babakiz_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: babakiz_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: